version: 2

models:
  - name: sales
    description: "DBT model for the sales table" 
  - name: product
    description: "DBT model for the product table"
  - name: purchase
    description: "DBT model for the purchase table"
  - name: clean_orders
    description: "DBT model for the ephemeral clean orders"
  - name: final_orders
    description: "DBT model for the final orders table"
  - name: session
    description: "DBT model for the session table"

sources:
  - name: sales
    database: MYDB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
  - name: product
    database: MYDB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC
  - name: purchase
    database: MYDB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC
  - name: orders
    database: MYDB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS
  
  - name: patient
    database: MYDB
    schema: PUBLIC
    tables:
      - name: PATIENT_SRC

  - name: session
    database: MYDB
    schema: BRONZE
    tables:
      - name: SESSION_SRC