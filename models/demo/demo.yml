version: 2

models:
  - name: sales
    description: "DBT model for the sales table" 
  - name: product
    description: "DBT model for the product table"
  - name: purchase
    description: "DBT model for the purchase table"

sources:
  - name: sales
    database: MYDB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
  - name: product
    database: MYDB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC
  - name: purchase
    database: MYDB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC